aid: avoca
name: Avoca
description: >-
  Avoca is "The AI Front Office for Service Businesses" — always-on AI agents
  that answer inbound calls, texts, and web chats 24/7 for home-services
  companies (HVAC, plumbing, electrical, pest control, garage door, and
  construction), book jobs, run multi-channel outbound re-engagement campaigns,
  score and coach every call, and respond to leads instantly. The company
  raised a $125M Series B at a $1B valuation and serves 1,000+ service
  businesses. Avoca publishes an Enterprise API (bearer API-key auth over
  https://enterprise-api.avoca.ai) that exposes read access to calls,
  transcripts, leads, teams, coach/QA evaluations, sessions, bookings, outbound
  texting, and Simple Scheduler analytics, plus HMAC-signed event webhooks and a
  Speed-to-Lead intake webhook — designed for enterprise partners ingesting
  Avoca activity into their BI warehouses and CRMs (ServiceTitan, Dialpad,
  Five9, 3CX).
